<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- CampusRide — Empty state illustration (no rides available). Editable: colors set once in <style> below. -->
<style>
  :root{
    --bg:#F6F4EF; --bg2:#FBEBD4; --road:#211D18; --lane:#F6F4EF;
    --primary:#DC8A2A; --teal:#1B6E62; --teal-l:#3FA396;
    --muted:#A69E8F; --line:#211D18; --post:#71695C;
  }
</style>

<g id="background">
  <rect width="480" height="360" rx="24" fill="var(--bg)"/>
  <circle cx="380" cy="70" r="70" fill="var(--bg2)" opacity="0.5"/>
</g>

<g id="road-perspective">
  <path d="M0 300 L200 190 L280 190 L480 300 Z" fill="var(--road)"/>
  <path d="M232 190 L248 190 L262 300 L218 300 Z" fill="var(--lane)" opacity="0.9"/>
  <rect x="0" y="300" width="480" height="60" fill="#E6E0D3"/>
</g>

<g id="signpost" transform="translate(330,120)">
  <rect x="10" y="20" width="6" height="90" rx="3" fill="var(--post)"/>
  <rect x="-30" y="10" width="90" height="34" rx="8" fill="var(--primary)"/>
  <text x="15" y="32" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">?</text>
</g>

<g id="magnifier" transform="translate(150,110)">
  <circle cx="30" cy="30" r="26" fill="none" stroke="var(--teal)" stroke-width="7"/>
  <line x1="49" y1="49" x2="72" y2="72" stroke="var(--teal)" stroke-width="9" stroke-linecap="round"/>
  <path d="M18 30a12 12 0 0112-12" stroke="var(--teal-l)" stroke-width="4" stroke-linecap="round" fill="none"/>
</g>

<g id="clouds" opacity="0.7">
  <path d="M60 70c-7 0-13-6-13-13s6-13 13-13c2-9 10-15 19-15s17 6 19 15h2c8 0 14 6 14 14s-6 14-14 14H60z" fill="#FFFFFF"/>
  <path d="M400 200c-5 0-9-4-9-9s4-9 9-9c1-6 7-10 13-10s12 4 13 10h1c6 0 10 4 10 10s-4 10-10 10h-27z" fill="#FFFFFF" opacity="0.7"/>
</g>

<g id="small-car-parked" transform="translate(60,255)" opacity="0.9">
  <path d="M4 30c-3 0-5-2-5-5V16c0-2 1-4 3-4l9-3c2-4 6-8 11-8h25c5 0 10 4 12 9l3 6h7c4 0 8 3 8 8v9c0 3-2 5-5 5H4z" fill="var(--muted)"/>
  <circle cx="17" cy="30" r="7" fill="#211D18"/>
  <circle cx="60" cy="30" r="7" fill="#211D18"/>
</g>

<g id="dashed-line" opacity="0.8">
  <line x1="240" y1="230" x2="240" y2="260" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
</g>

<text x="240" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="var(--line)">No rides here yet</text>
<text x="240" y="358" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--muted)">Try a different route, or be the first to post one</text>
</svg>
