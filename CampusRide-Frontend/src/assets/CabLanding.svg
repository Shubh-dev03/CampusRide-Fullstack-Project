<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- CampusRide — Landing hero illustration. Editable: colors are set once in <style> below. -->
<style>
  :root{
    --bg:#F6F4EF; --bg2:#FBEBD4; --road:#211D18; --lane:#F6F4EF;
    --primary:#DC8A2A; --primary-d:#B96E1A; --teal:#1B6E62; --teal-l:#3FA396;
    --skin:#F0C29A; --skin2:#C98858; --cloth1:#211D18; --cloth2:#FFFFFF;
    --line:#211D18; --muted:#A69E8F;
  }
</style>

<g id="background">
  <rect width="480" height="360" rx="24" fill="var(--bg)"/>
  <circle cx="400" cy="70" r="90" fill="var(--bg2)" opacity="0.6"/>
  <circle cx="60" cy="60" r="46" fill="var(--teal-l)" opacity="0.12"/>
</g>

<g id="sky-decor">
  <path id="cloud" d="M60 90c-9 0-16-7-16-16s7-16 16-16c2-11 12-19 24-19s22 8 24 19h2c10 0 18 8 18 18s-8 18-18 18H60z" fill="#FFFFFF" opacity="0.7"/>
  <g id="location-pin" transform="translate(300,40)">
    <path d="M0 0c-11 0-20 9-20 20 0 15 20 34 20 34s20-19 20-34c0-11-9-20-20-20z" fill="var(--primary)"/>
    <circle cx="0" cy="19" r="7" fill="#FFFFFF"/>
  </g>
</g>

<g id="campus-buildings" opacity="0.9">
  <rect x="20" y="150" width="46" height="90" rx="4" fill="#EFEBE1"/>
  <rect x="30" y="164" width="10" height="12" rx="2" fill="var(--teal-l)" opacity="0.5"/>
  <rect x="46" y="164" width="10" height="12" rx="2" fill="var(--teal-l)" opacity="0.5"/>
  <rect x="30" y="186" width="10" height="12" rx="2" fill="var(--teal-l)" opacity="0.5"/>
  <rect x="46" y="186" width="10" height="12" rx="2" fill="var(--teal-l)" opacity="0.5"/>
  <rect x="410" y="170" width="50" height="70" rx="4" fill="#EFEBE1"/>
</g>

<g id="ground">
  <rect x="0" y="255" width="480" height="60" fill="var(--road)"/>
  <rect x="0" y="255" width="480" height="6" fill="#3A342B"/>
  <g id="lane-dashes">
    <rect x="10"  y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="70"  y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="130" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="190" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="250" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="310" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="370" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
    <rect x="430" y="283" width="26" height="6" rx="3" fill="var(--lane)"/>
  </g>
  <rect x="0" y="315" width="480" height="45" fill="#E6E0D3"/>
</g>

<g id="car" transform="translate(150,175)">
  <rect x="0" y="46" width="150" height="16" rx="8" fill="#00000022"/>
  <path d="M8 60c-6 0-10-4-10-10V32c0-4 3-8 7-9l18-5c3-9 12-16 22-16h50c11 0 21 8 24 18l6 12h13c9 0 16 7 16 16v18c0 6-4 10-10 10H8z" fill="var(--primary)"/>
  <path d="M45 18l-10 20h34V16H55c-4 0-8 1-10 2z" fill="var(--teal)"/>
  <path d="M79 16v22h34l-8-16c-2-4-6-6-10-6H79z" fill="var(--teal)"/>
  <circle cx="34" cy="60" r="14" fill="#211D18"/>
  <circle cx="34" cy="60" r="6" fill="#EFEBE1"/>
  <circle cx="120" cy="60" r="14" fill="#211D18"/>
  <circle cx="120" cy="60" r="6" fill="#EFEBE1"/>
  <rect x="6" y="30" width="8" height="8" rx="2" fill="#F7C077"/>
</g>

<g id="student-standing" transform="translate(345,150)">
  <circle cx="20" cy="18" r="16" fill="var(--skin)"/>
  <path d="M4 12a16 14 0 0132 0c-6 3-26 3-32 0z" fill="var(--cloth1)"/>
  <rect x="6" y="32" width="28" height="46" rx="12" fill="var(--teal)"/>
  <rect x="2" y="40" width="10" height="30" rx="5" fill="var(--skin)"/>
  <rect x="30" y="40" width="10" height="26" rx="5" fill="var(--skin)" transform="rotate(18 30 40)"/>
  <rect x="10" y="76" width="9" height="24" rx="4" fill="#211D18"/>
  <rect x="23" y="76" width="9" height="24" rx="4" fill="#211D18"/>
  <rect x="8" y="98" width="13" height="6" rx="3" fill="var(--primary-d)"/>
  <rect x="21" y="98" width="13" height="6" rx="3" fill="var(--primary-d)"/>
  <rect x="26" y="46" width="16" height="20" rx="4" fill="var(--primary)" transform="rotate(18 26 46)"/>
</g>

<g id="passenger-window" transform="translate(190,196)">
  <circle cx="14" cy="10" r="9" fill="var(--skin2)"/>
  <path d="M4 8a10 9 0 0120 0c-3 2-17 2-20 0z" fill="#211D18"/>
</g>
<g id="passenger-window2" transform="translate(226,196)">
  <circle cx="14" cy="10" r="9" fill="var(--skin)"/>
  <path d="M2 6c2-4 8-6 12-6s10 2 12 6" stroke="#211D18" stroke-width="4" stroke-linecap="round" fill="none"/>
</g>

<g id="sparkles" opacity="0.8">
  <path d="M270 100l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--teal)"/>
  <path d="M370 200l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="var(--primary)"/>
</g>
</svg>
